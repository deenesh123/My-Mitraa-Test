    <script>
      // Gracefully prevent browser extension injection errors (e.g., MetaMask, adblockers, wallet providers) from interfering with the app
      window.addEventListener('error', function(event) {
        if (event.filename && event.filename.includes('chrome-extension://')) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
        if (event.message && (event.message.includes('MetaMask') || event.message.includes('inpage.js') || event.message.includes('ethereum'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        if (reason && (String(reason).includes('MetaMask') || (reason.stack && reason.stack.includes('chrome-extension://')))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
  </head>
